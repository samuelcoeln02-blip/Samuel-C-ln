# Netlify-Konfiguration
#
# Ziel: Deploys (und damit Build-Guthaben) NUR verbrauchen, wenn sich echte
# Website-Dateien ändern. Reine Arbeit am E-Book-Manuskript/Werkzeug
# (tools/ebook/**) löst KEINEN Deploy aus.
#
# WICHTIG: assets/downloads/kettlebell-mastery* ist bewusst NICHT mehr
# ausgeschlossen – diese PDFs werden live von der Website ausgeliefert
# (Kauf-Flow + Gratis-Leseprobe). Ein Commit, der nur die PDF ändert, muss
# also einen echten Deploy auslösen, sonst bleibt die alte Datei live.
#
# Die "ignore"-Regel wird von Netlify vor jedem Build ausgeführt:
#   Exit-Code 0  -> Build wird ÜBERSPRUNGEN (keine Änderung außerhalb der Ausnahmen)
#   Exit-Code !0 -> Build läuft normal (echte Website-Änderung vorhanden)
#
# git diff --quiet liefert 0, wenn es KEINE Unterschiede gibt – hier bezogen
# auf alles AUSSER den ausgeschlossenen Pfaden.

[build]
  publish = "."
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)tools/ebook'"
