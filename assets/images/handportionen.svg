<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 480" width="1160" height="480" font-family="Inter, Arial, sans-serif">
  <defs>
    <style>
      .label { font-size: 21px; font-weight: 800; fill: #0B0B0F; }
      .sub    { font-size: 14.5px; font-weight: 600; fill: #6B7280; }
      .dot    { }
    </style>
  </defs>

  <!-- Titel -->
  <text x="40" y="46" font-size="26" font-weight="800" fill="#0B0B0F">Ernährung ohne Zählen – die Handportionen</text>
  <text x="40" y="70" font-size="15" font-weight="600" fill="#6B7280">Deine Hand ist dein Maßstab, bei jeder Mahlzeit</text>

  <!-- ============ KARTEN-HINTERGRUND ============ -->
  <g fill="#F4F6FA" stroke="#E3E7EF" stroke-width="1.5">
    <rect x="40"  y="92" width="256" height="360" rx="18"/>
    <rect x="316" y="92" width="256" height="360" rx="18"/>
    <rect x="592" y="92" width="256" height="360" rx="18"/>
    <rect x="868" y="92" width="256" height="360" rx="18"/>
  </g>

  <!-- ============ ICON 1: PROTEIN – flache Hand ============ -->
  <g transform="translate(168,205)" fill="#1552F0">
    <rect x="-32" y="-6" width="64" height="58" rx="17"/>
    <rect x="-33" y="-42" width="15" height="44" rx="7.5"/>
    <rect x="-15" y="-54" width="15" height="56" rx="7.5"/>
    <rect x="3"   y="-60" width="15" height="62" rx="7.5"/>
    <rect x="21"  y="-52" width="15" height="54" rx="7.5"/>
    <rect x="-56" y="-6" width="17" height="44" rx="8.5" transform="rotate(-32 -47 16)"/>
  </g>
  <text class="label" x="168" y="330" text-anchor="middle">Protein</text>
  <text class="sub" x="168" y="356" text-anchor="middle">Handfläche</text>
  <text class="sub" x="168" y="378" text-anchor="middle">(Größe + Dicke)</text>
  <text class="sub" x="168" y="404" text-anchor="middle">1× pro Mahlzeit</text>

  <!-- ============ ICON 2: KOHLENHYDRATE – hohle Hand ============ -->
  <g transform="translate(444,205)">
    <path d="M -46,-38 C -66,-6 -60,34 -26,50 C 8,66 46,50 54,14 C 58,-4 50,-16 50,-16"
          fill="none" stroke="#0A2E8F" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-8" cy="6"  r="7" fill="#0A2E8F"/>
    <circle cx="10" cy="-4" r="7" fill="#0A2E8F"/>
    <circle cx="8"  cy="16" r="7" fill="#0A2E8F"/>
    <circle cx="-10" cy="22" r="7" fill="#0A2E8F"/>
  </g>
  <text class="label" x="444" y="330" text-anchor="middle">Kohlenhydrate</text>
  <text class="sub" x="444" y="356" text-anchor="middle">Hohle Hand</text>
  <text class="sub" x="444" y="378" text-anchor="middle">(gehäuft)</text>
  <text class="sub" x="444" y="404" text-anchor="middle">1–2× pro Mahlzeit</text>

  <!-- ============ ICON 3: GEMÜSE – Faust ============ -->
  <g transform="translate(720,205)" fill="#12B76A">
    <path d="M -38,-30 Q -46,4 -30,32 Q -10,54 22,50 Q 48,46 50,18 Q 52,-10 34,-30 Q 14,-48 -10,-46 Q -30,-44 -38,-30 Z"/>
  </g>
  <g transform="translate(720,205)" stroke="#0A6E45" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M -18,-30 Q -12,-20 -18,-10"/>
    <path d="M 4,-34 Q 10,-24 4,-13"/>
    <path d="M 25,-26 Q 31,-16 26,-6"/>
  </g>
  <text class="label" x="720" y="330" text-anchor="middle">Gemüse</text>
  <text class="sub" x="720" y="356" text-anchor="middle">Eine Faust</text>
  <text class="sub" x="720" y="378" text-anchor="middle">(mindestens)</text>
  <text class="sub" x="720" y="404" text-anchor="middle">bei jeder Mahlzeit</text>

  <!-- ============ ICON 4: FETT – Daumen ============ -->
  <g transform="translate(996,205)" fill="#6B7280">
    <rect x="-19" y="-52" width="38" height="88" rx="19"/>
    <ellipse cx="0" cy="-38" rx="11" ry="14" fill="#8C93A3"/>
  </g>
  <path d="M 976,192 Q 996,198 1016,192" transform="translate(0,0)" fill="none" stroke="#F4F6FA" stroke-width="3" opacity="0"/>
  <text class="label" x="996" y="330" text-anchor="middle">Fett</text>
  <text class="sub" x="996" y="356" text-anchor="middle">Ein Daumen</text>
  <text class="sub" x="996" y="378" text-anchor="middle">(Größe)</text>
  <text class="sub" x="996" y="404" text-anchor="middle">1× pro Mahlzeit</text>
</svg>
