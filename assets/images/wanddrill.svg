<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" width="1040" height="620" font-family="Inter, Arial, sans-serif">
  <defs>
    <style>
      .label { font-size: 20px; font-weight: 700; fill: #0B0B0F; }
      .sub    { font-size: 14px; font-weight: 600; fill: #6B7280; }
      .lead   { stroke: #C3C9D6; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0A2E8F"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="26" font-weight="800" fill="#0B0B0F">Der Wand-Drill</text>
  <text x="40" y="70" font-size="15" font-weight="600" fill="#6B7280">So lernst du das Gefühl „Hüfte nach hinten"</text>

  <!-- Boden -->
  <line x1="150" y1="500" x2="800" y2="500" stroke="#E3E7EF" stroke-width="4" stroke-linecap="round"/>

  <!-- Wand -->
  <rect x="150" y="210" width="26" height="290" fill="#C7CFDD"/>
  <rect x="176" y="210" width="6" height="290" fill="#AEB7C9"/>

  <!-- GHOST: aufrechter Start -->
  <g opacity="0.42">
    <circle cx="581" cy="222" r="26" fill="#D7DCE5"/>
    <rect x="560" y="250" width="42" height="112" rx="21" fill="#D7DCE5"/>
    <path d="M566 266 L566 352" stroke="#D7DCE5" stroke-width="14" stroke-linecap="round"/>
    <path d="M581 360 L581 500" stroke="#D7DCE5" stroke-width="24" stroke-linecap="round"/>
  </g>
  <text x="581" y="184" font-size="13" font-weight="700" fill="#9AA3B2" text-anchor="middle">START</text>

  <!-- SOLID: Huefte zurueck, Gesaess tippt die Wand an -->
  <g stroke="#D7DCE5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M430 476 L375 395 L340 345 L480 275" stroke-width="50"/>
    <path d="M480 278 L505 368" stroke-width="26"/>
  </g>
  <path d="M430 480 L476 480" stroke="#D7DCE5" stroke-width="20" stroke-linecap="round"/>
  <circle cx="510" cy="241" r="30" fill="#D7DCE5"/>

  <!-- Huefte-Markierung -->
  <ellipse cx="352" cy="350" rx="26" ry="22" fill="#1552F0"/>

  <!-- Pfeil: Huefte nach hinten -->
  <path d="M560 352 C 480,354 420,352 382,350" fill="none" stroke="#0A2E8F" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="470" y="330" font-size="14" font-weight="700" fill="#0A2E8F" text-anchor="middle">Hüfte nach hinten</text>

  <!-- Fussabstand-Massline -->
  <line x1="176" y1="524" x2="430" y2="524" stroke="#6B7280" stroke-width="2"/>
  <line x1="176" y1="516" x2="176" y2="532" stroke="#6B7280" stroke-width="2"/>
  <line x1="430" y1="516" x2="430" y2="532" stroke="#6B7280" stroke-width="2"/>
  <text class="sub" x="303" y="552" text-anchor="middle">eine Fußlänge Abstand</text>

  <!-- Callouts -->
  <polyline class="lead" points="352,328 352,120 620,120"/>
  <circle cx="352" cy="328" r="4" fill="#1552F0"/>
  <text class="label" x="636" y="114">Gesäß tippt die Wand an</text>
  <text class="sub"   x="636" y="136">ohne die Knie stark zu beugen</text>

  <polyline class="lead" points="500,240 610,240 610,300"/>
  <circle cx="500" cy="240" r="4" fill="#6B7280"/>
  <text class="label" x="626" y="306" text-anchor="start">Rücken bleibt lang</text>
  <text class="sub"   x="626" y="328" text-anchor="start">Blick leicht nach unten-vorne</text>
</svg>
